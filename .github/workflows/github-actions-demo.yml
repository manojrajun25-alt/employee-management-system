name: Java CI Pipeline

  on:
    push:
      branches:
        - main
        - develop

    pull_request:
      branches:
        - main
        - develop

  jobs:
    build:

      runs-on: ubuntu-latest

      steps:

        - name: Checkout Source Code
          uses: actions/checkout@v4

        - name: Setup Java 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'

        - name: Build Application
          run: mvn clean install

        - name: Run Test Cases
          run: mvn test
