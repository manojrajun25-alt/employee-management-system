# Language: YAML
# This GitHub Actions workflow demonstrates CI/CD for a Java Spring Boot project.
# It runs on push and pull request, builds, tests, caches dependencies, and deploys.

name: Java Spring Boot CI/CD Demo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/adoptopenjdk-17-hotspot
    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up JDK (Java 17 in this example)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # Step 4: Build the project and run tests
      - name: Build and Test with Maven
        run: mvn clean verify

      # Step 5: Run static code analysis (optional, using SpotBugs)
      - name: SpotBugs Analysis
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:spotbugs

      # Step 6: Package the Spring Boot application
      - name: Package Application
        run: mvn package

      # Step 7: Deploy to staging (demo: just echo for now)
      - name: Deploy to Staging (demo)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying Spring Boot app to staging server..."
          echo "This is a demo step."

      # Step 8: Publish build artifacts (optional)
      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v3
        with:
          name: spring-boot-app
          path: target/*.jar
