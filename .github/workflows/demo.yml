# YAML: GitHub Actions workflow for Java Spring Boot
name: Java CI with Spring Boot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4  # Using latest stable version, avoids deprecated actions

      # Step 2: Setup JDK
      - name: Setup Java
        uses: actions/setup-java@v4  # Updated version
        with:
          distribution: 'temurin'   # OpenJDK distribution
          java-version: 17

      # Step 3: Cache Maven dependencies for faster builds
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4: Build and test using Maven
      - name: Build with Maven
        run: mvn clean install -DskipTests=false

      # Step 5: Run tests selectively (optional)
      - name: Run specific tests
        run: mvn test -Dtest=com.example.MyServiceTest*

      # Step 6: Package Spring Boot application
      - name: Package Spring Boot App
        run: mvn package

      # Step 7: Upload JAR as artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4  # Updated version
        with:
          name: spring-boot-app
          path: target/*.jar

    # Step 8: Optional: Deploy to server or container
    #- name: Deploy
    #  run: echo "Deploy logic goes here"